name: Publier l'app web

# Publie l'app sur GitHub Pages à chaque push. L'URL obtenue est permanente :
# c'est elle qu'on ajoute à l'écran d'accueil du téléphone.
#
# À configurer une fois dans Settings :
#  - Pages -> Source : "GitHub Actions"
#  - Secrets and variables -> Actions -> onglet Secrets :
#      EXPO_PUBLIC_SUPABASE_URL
#      EXPO_PUBLIC_SUPABASE_ANON_KEY
#      EXPO_PUBLIC_API_URL   (l'URL Cloud Run, en https)
#
# Les trois sont lues dans `secrets`, pas dans `vars`. Aucune n'est réellement
# confidentielle — elles finissent dans le bundle JS, et la clé anon est
# publique par conception (c'est la RLS qui protège les données) — mais les
# garder au même endroit évite l'erreur classique : une valeur rangée dans le
# mauvais onglet est lue comme une chaîne vide, sans le moindre avertissement.
#
# L'URL de l'API doit être en HTTPS, sinon le navigateur bloquera les appels
# depuis une page servie en HTTPS.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.12"
      - run: npm ci --ignore-scripts

      # Expo remplace process.env.EXPO_PUBLIC_* à la construction. Si une
      # valeur manque, elle devient une chaîne vide : le build RÉUSSIT et
      # publie une app incapable de joindre Supabase. Échouer ici est la
      # seule façon de voir le problème autrement qu'en production.
      - name: Vérifier que la configuration est présente
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          API: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          fail=0
          for n in URL KEY API; do
            v="${!n}"
            if [ -z "$v" ]; then
              echo "::error::$n est vide — à définir dans Settings > Secrets and variables > Actions"
              fail=1
            else
              echo "$n : OK (${#v} caractères)"
            fi
          done
          exit $fail

      - name: Construire l'app web
        run: npx expo export --platform web
        env:
          # Doit correspondre au nom du dépôt, sinon page blanche.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      # expo-router gère la navigation côté client : sans ce fichier, un
      # rechargement sur une sous-page renverrait une 404 de GitHub.
      - name: Rediriger les sous-pages vers l'app
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
